<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>ServiHUB — Gestão de serviços</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<section id="login" class="login-screen" hidden><form id="login-form" class="login-card"><span class="logo">S</span><h1>ServiHUB</h1><p class="muted">Organize seu negócio</p><label>E-mail<input type="email" name="email" autocomplete="username" required maxlength="254" placeholder="seu@email.com"></label><label>Senha<input type="password" name="senha" autocomplete="current-password" minlength="6" maxlength="128" required placeholder="Sua senha"></label><p id="login-error" class="form-error" role="alert"></p><button type="submit" class="primary full">Entrar</button><button type="button" id="show-signup" class="secondary full">Criar conta</button></form></section><section id="signup" class="login-screen" hidden><form id="signup-form" class="login-card signup-card">
<h1>Criar conta de cliente</h1><p class="muted">Cadastre seus dados para acessar seus serviços.</p>
<div class="form-grid">
<label>Nome<input name="nome" required maxlength="120" autocomplete="name"></label>
<label>Telefone<input name="telefone" type="tel" required pattern="[0-9]{10,15}" minlength="10" maxlength="15" inputmode="numeric" autocomplete="tel" title="De 10 a 15 números, incluindo DDD"></label>
<label>E-mail<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
<label>Senha (6 números)<input name="senha" type="password" required minlength="6" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="new-password" title="Exatamente seis números"></label>
<label>Logradouro<input name="logradouro" required maxlength="120" autocomplete="address-line1"></label>
<label>Número<input name="numero" required maxlength="20"></label>
<label>Complemento (opcional)<input name="complemento" maxlength="120" autocomplete="address-line2"></label>
<label>Bairro<input name="bairro" required maxlength="120"></label>
<label>Cidade<input name="cidade" required maxlength="120" autocomplete="address-level2"></label>
<label>UF<select name="uf" required autocomplete="address-level1"><option value="">Selecione</option>
<option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option>
</select></label>
<label>CEP<input name="cep" required pattern="[0-9]{8}" minlength="8" maxlength="8" inputmode="numeric" autocomplete="postal-code" title="Oito números"></label>
</div><p id="signup-error" class="form-error" role="alert"></p>
<button type="submit" class="primary full">Criar conta</button><button type="button" id="cancel-signup" class="secondary full">Cancelar e voltar ao login</button>
</form></section><div id="app" hidden><aside class="sidebar"><a href="#inicio" class="brand"><span class="logo">S</span><span id="company-brand">ServiHUB</span></a><nav aria-label="Navegação principal"><a href="#inicio" data-page="inicio">Início</a><a href="#clientes" data-page="clientes">Clientes</a><a href="#servicos" data-page="servicos">Serviços</a><a href="#agenda" data-page="agenda">Agenda</a><a href="#orcamentos" data-page="orcamentos">Orçamentos</a><a href="#pagamentos" data-page="pagamentos">Pagamentos</a><a href="#pendencias" data-page="pendencias">Pendencias e lembretes</a><a href="#contas" data-page="contas">Contas</a><a href="#configuracoes" data-page="configuracoes">Configurações</a></nav><button class="logout-button subtle">Sair da conta ↪</button></aside><div class="workspace"><header class="topbar"><h1 id="page-title">Início</h1><div class="top-right"><button id="refresh" class="subtle" title="Atualizar dados" aria-label="Atualizar dados">↻</button><span>Olá, Prestador!</span><span class="avatar" aria-hidden="true">P</span><button class="logout-button logout-mobile subtle">Sair</button></div></header><main id="main" tabindex="-1"><div class="page-heading"><span id="page-subtitle" hidden></span><span id="breadcrumb" hidden></span><button id="page-action" class="primary" hidden>+ Novo cliente</button></div><div id="page-error" class="notice error" role="alert" hidden></div><div id="content">Carregando…</div></main></div></div>
<dialog id="modal"><form id="record-form"><div class="modal-heading"><div><p class="eyebrow">SERVIHUB</p><h2 id="modal-title"></h2></div><button type="button" class="close" data-close aria-label="Fechar">×</button></div><div id="fields" class="form-grid"></div><p id="form-error" class="form-error" role="alert"></p><div class="modal-actions"><button type="button" class="secondary" data-close>Cancelar</button><button type="submit" class="primary" id="save-record">Salvar</button></div></form></dialog><div id="toast" role="status" hidden></div>
</body></html>
